<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Engineer Tab Organizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Engineer Tab Organizer</h1>
        <p id="summary">読み込み中…</p>
      </header>

      <section id="current-tab" class="current-tab" aria-label="現在のタブ">
        <p id="ct-title" class="ct-title">—</p>
        <div class="ct-controls">
          <label class="ct-field">
            <span>カテゴリ</span>
            <select id="ct-category"></select>
          </label>
          <label class="ct-field">
            <span>適用範囲</span>
            <select id="ct-scope">
              <option value="host">このサイト</option>
              <option value="hostPath">このパス</option>
            </select>
          </label>
        </div>
        <p id="ct-reason" class="ct-reason">—</p>
        <button id="ct-reset" type="button" class="link-btn" hidden>
          ルールの判定に戻す
        </button>
      </section>

      <section id="counts" aria-label="カテゴリ別の内訳"></section>
      <p id="skipped" class="note" hidden></p>

      <section class="actions">
        <button id="btn-organize" type="button">今すぐ整理</button>
        <button id="btn-rebuild" type="button">グループを作り直す</button>
        <button id="btn-suggest" type="button">分割候補を提案</button>
        <button id="btn-undo" type="button">直前の整理を取り消す</button>
        <button id="btn-dissolve" type="button" class="link-btn danger-link">
          グループを全解除
        </button>
      </section>

      <section id="pairs" hidden>
        <h2>分割候補</h2>
        <ul id="pairs-list"></ul>
      </section>

      <section class="settings">
        <h2>設定</h2>
        <label>
          <input id="set-auto-group" type="checkbox" />
          新しいタブを自動でグループに入れる
        </label>
        <p class="note sub-note">
          既にあるグループへ追加するだけです。新しいグループは作りません。
        </p>
        <label>
          <input id="set-ignore-pinned" type="checkbox" />
          ピン留めタブは対象外にする
        </label>
        <label>
          <input id="set-keep-active" type="checkbox" />
          アクティブなタブの位置を保つ
        </label>
        <label>
          <input id="set-sort-groups" type="checkbox" />
          グループをカテゴリ順に並べる
        </label>
        <label>
          <input id="set-sort-tabs" type="checkbox" />
          グループ内で同じサイトのタブをまとめる
        </label>
        <label>
          <input id="set-adopt-groups" type="checkbox" />
          再起動後も自分のグループを引き継ぐ
        </label>
        <p class="note">
          自分で作ったグループは変更しません。
        </p>
        <button id="btn-options" type="button" class="link-btn">
          修正・除外サイトの管理…
        </button>
      </section>

      <p id="status" class="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
