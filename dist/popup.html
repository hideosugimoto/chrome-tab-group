<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Engineer Tab Organizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Engineer Tab Organizer</h1>
        <p id="summary">Loading…</p>
      </header>

      <section id="current-tab" class="current-tab" aria-label="Current tab">
        <p id="ct-title" class="ct-title">—</p>
        <div class="ct-controls">
          <label class="ct-field">
            <span>Category</span>
            <select id="ct-category"></select>
          </label>
          <label class="ct-field">
            <span>Applies to</span>
            <select id="ct-scope">
              <option value="host">This site</option>
              <option value="hostPath">This path</option>
            </select>
          </label>
        </div>
        <p id="ct-reason" class="ct-reason">—</p>
        <button id="ct-reset" type="button" class="link-btn" hidden>
          Reset to rule default
        </button>
      </section>

      <section id="counts" aria-label="Category preview"></section>
      <p id="skipped" class="note" hidden></p>

      <section class="actions">
        <button id="btn-organize" type="button">Organize now</button>
        <button id="btn-suggest" type="button">Suggest split pairs</button>
        <button id="btn-undo" type="button">Undo last organize</button>
      </section>

      <section id="pairs" hidden>
        <h2>Suggested pairs</h2>
        <ul id="pairs-list"></ul>
      </section>

      <section class="settings">
        <h2>Settings</h2>
        <label>
          <input id="set-ignore-pinned" type="checkbox" />
          Ignore pinned tabs
        </label>
        <label>
          <input id="set-keep-active" type="checkbox" />
          Keep active tab position
        </label>
        <label>
          <input id="set-sort-groups" type="checkbox" />
          Sort groups by category
        </label>
        <label>
          <input id="set-adopt-groups" type="checkbox" />
          Re-adopt my groups after restart
        </label>
        <p class="note">
          Groups you created yourself are never modified.
        </p>
      </section>

      <p id="status" class="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
